[project]
name = "visualize-backend"
version = "0.1.0"
description = "Backend API for Visualize Mechanics - Physics problem solver"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "openai>=1.30.0",
    "tenacity>=8.2.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "simpleeval>=0.9.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.24.0",  # 0.24+ supports Python 3.13+
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.uvicorn]
app = "app.main:app"
host = "0.0.0.0"
port = 3000
reload = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true